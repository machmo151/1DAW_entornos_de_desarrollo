<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Saludo</title>
</head>
<body>
<script>
function crearSaludo(nombre, hora) {
  let saludo = "Hola";
 
  if (hora < 12) {
    saludo = "Buenos días";
  } else if (hora < 20) {
    saludo = "Buenas tardes";
  } else {
    saludo = "Buenas noches";
  }
 
  return saludo + ", " + nombre + "!";
}
 
let nombre = "Ana";
let hora = 15;

// ANOTACIÓN DE ERROR:
// - Los argumentos al llamar a la función estaban invertidos: 
//   se pasaba 'hora' primero y 'nombre' después, cuando la función 
//   espera (nombre, hora). Se corrige pasando (nombre, hora).

let mensaje = crearSaludo(nombre, hora);
console.log(mensaje);
</script>
</body>
</html>
